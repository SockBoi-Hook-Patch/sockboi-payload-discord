# Fly.io configuration for SockBoi's Payload Discord bot
# Docs: https://fly.io/docs/reference/configuration/

app = "sockboi-payload-discord"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  WELCOME_VOICE = "1"

[http_service]
  internal_port = 8080
  force_https = false
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/livez"

[[mounts]]
  source = "sockboi_data"
  destination = "/data"
  initial_size = "1GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
